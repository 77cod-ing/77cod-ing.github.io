<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment Successful — 77cod_ing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1120;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 520px;
            text-align: center;
            background: #111827;
            border: 1px solid #243044;
            border-radius: 18px;
            padding: 40px 25px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 15px;
        }

        p {
            color: #b8c1d1;
            line-height: 1.7;
        }

        .error {
            color: #ff6b81;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon" id="icon">
        ⏳
    </div>

    <h1 id="title">
        Verifying Payment...
    </h1>

    <p id="message">
        Please wait while we confirm your payment.
    </p>

</div>

<script>

const SALES_API =
    "https://77coding-sales.tt2980665.workers.dev";

const params =
    new URLSearchParams(
        window.location.search
    );

const orderID =
    params.get("token");

const icon =
    document.getElementById("icon");

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

async function verifyPayment() {

    if (!orderID) {

        icon.textContent = "✕";

        title.textContent =
            "Payment Could Not Be Verified";

        message.textContent =
            "The PayPal order ID is missing.";

        message.classList.add("error");

        return;
    }

    try {

        const response =
            await fetch(
                `${SALES_API}/api/capture-order`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        orderID: orderID
                    })
                }
            );

        const data =
            await response.json();

        console.log(
            "Payment verification:",
            data
        );

        if (
            response.ok &&
            data.success === true
        ) {

            icon.textContent = "✓";

            title.textContent =
                "Payment Successful!";

            message.textContent =
                "Your project will be sent to your email within less than 48 hours.";

            return;
        }

        throw new Error(
            data.error ||
            data.message ||
            "Payment could not be verified."
        );

    } catch (error) {

        console.error(
            "Payment verification error:",
            error
        );

        icon.textContent = "✕";

        title.textContent =
            "Payment Verification Failed";

        message.textContent =
            "We could not confirm your payment right now. Please do not pay again. Your order may still be processing. Please contact us if the problem continues.";

        message.classList.add("error");
    }
}

verifyPayment();

</script>

</body>
</html>
