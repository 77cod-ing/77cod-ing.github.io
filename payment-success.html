<body>

<div class="card">

    <div class="icon" id="icon">✓</div>

    <h1 id="title">Processing Payment...</h1>

    <p id="message">
        Please wait while we verify your PayPal payment.
    </p>

    <div class="status" id="status">
        Connecting to PayPal...
    </div>

    <div class="order-id" id="orderBox" style="display:none;"></div>

    <a
        class="button"
        href="https://77cod-ing.github.io/"
        id="homeButton"
        style="display:none;"
    >
        Back to 77cod_ing
    </a>

</div>

<script>

const SALES_API =
    "https://77coding-sales.tt2980665.workers.dev";

const params = new URLSearchParams(window.location.search);

const orderID = params.get("token");

const title = document.getElementById("title");
const message = document.getElementById("message");
const status = document.getElementById("status");
const icon = document.getElementById("icon");
const orderBox = document.getElementById("orderBox");
const homeButton = document.getElementById("homeButton");

async function capturePayment() {

    if (!orderID) {

        title.textContent = "Payment Error";
        message.textContent =
            "No PayPal order ID was found.";

        status.textContent =
            "The payment could not be verified.";

        status.classList.add("error");

        icon.textContent = "!";
        homeButton.style.display = "inline-block";

        return;
    }

    orderBox.style.display = "block";
    orderBox.textContent =
        "PayPal Order ID: " + orderID;

    try {

        const response = await fetch(
            `${SALES_API}/api/capture-order`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    orderID: orderID
                })
            }
        );

        const data = await response.json();

        console.log("Capture response:", data);

        if (!response.ok || !data.success) {
            throw new Error(
                data.error ||
                "Payment capture failed."
            );
        }

        title.textContent = "Payment Successful!";

        message.textContent =
            "Your PayPal Sandbox payment has been successfully verified.";

        status.textContent =
            "Payment completed and the order was saved.";

        icon.textContent = "✓";

        homeButton.style.display = "inline-block";

    } catch (error) {

        console.error(
            "Payment capture error:",
            error
        );

        title.textContent =
            "Payment Verification Failed";

        message.textContent =
            "PayPal returned to the website, but we could not complete the payment verification.";

        status.textContent =
            error.message;

        status.classList.add("error");

        icon.textContent = "!";

        homeButton.style.display =
            "inline-block";
    }
}

capturePayment();

</script>
